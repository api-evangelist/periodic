description: 'Periodic (Periodic Labs) is an AI research company building "AI scientists" paired with
  autonomous laboratories to accelerate discovery in the physical sciences, with an early focus on materials
  science and higher-temperature superconductors. Their systems hypothesize, run physical experiments, and
  learn from the results, and they partner with industry to optimize experimental processes. Surfaced as a
  portfolio company of CRV and Felicis, the company is at an early stage and does not currently publish a
  public API, developer documentation, or developer platform. This profile records that honest result; it
  is not penalized for having no API surface.'
